[project]
name = "gk-pay-skills-mcp"
version = "0.1.0"
description = "支付宝 A2M 按量付费技能 MCP Server（13 个工具，0.05 元/次）"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/gk-pay-skills-mcp/gk-pay-skills-mcp"
Repository = "https://github.com/gk-pay-skills-mcp/gk-pay-skills-mcp"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
